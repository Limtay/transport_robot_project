[develop]
script_dir=$base/lib/control_web
[install]
install_scripts=$base/lib/control_web

[tool:pytest]
# ~/.local 의 anyio 4.14 가 pytest 플러그인을 entry point 로 등록하는데, 시스템 pytest 는
# 6.2.5 라 그 플러그인이 찾는 _pytest.scope 가 없다 → 수집 단계에서 ModuleNotFoundError 로
# 죽는다 (colcon test 가 result 파일도 못 남기고 끝난다).
# anyio 를 지울 수는 없다 — jupyter_server/jupyter_client 가 httpx 를 통해 물고 있다.
# 지울 필요도 없다: 플러그인만 끄면 된다.
addopts = -p no:anyio
